name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tester
        uses: actions/checkout@v4
      - name: Checkout course references
        uses: actions/checkout@v4
        with:
          repository: codecrafters-io/build-your-own-firewall
          path: course
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Test inbound WAF curriculum
        run: make test
        env:
          WAF_COURSE_DIR: ${{ github.workspace }}/course
