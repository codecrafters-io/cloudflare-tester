slug: cloudflare
name: Build your own AI Firewall
short_name: AI Firewall
release_status: alpha
description_md: |-
  How can an AI agent leak a customer record through a URL? Even harmless-looking browsing tools can carry private data. An AI firewall inspects traffic between an application and a language model. You'll build one that blocks prompt injections and unauthorized data exports.

  Along the way, you'll learn about HTTP proxies, prompt injection, streaming, and more.
short_description_md: Learn about HTTP proxies, prompt injection, streaming, and more
completion_percentage: 5
languages:
- slug: go
  release_status: alpha
- slug: python
  release_status: alpha
marketing:
  difficulty: hard
  sample_extension_idea_title: Rate limiting
  sample_extension_idea_description: An AI firewall that can limit requests before they reach the model.
  frequently_asked_questions:
  - question_markdown: What exactly will I build?
    answer_markdown: |-
      You'll build an HTTP proxy in front of an OpenAI-compatible chat completions API. It will normalize messages for inspection, combine heuristic signals with a classifier service, redact secrets, inspect streamed output, and check tool calls against trusted policy.

      In the final stage, your firewall will stop a scripted attack that hides a customer record inside a browsing tool's URL, even when both prompt detectors miss the injection. An official OpenAI SDK client will communicate through your proxy unchanged.

      Later extensions could add:

      * Rate limiting before requests reach the model

      At the end, you'll have a GitHub repo to show off.
  - question_markdown: What exactly will I learn?
    answer_markdown: |-
      In the first 11 stages, you'll learn about HTTP proxies, Unicode normalization, heuristic scoring, classifier services, policy thresholds, redaction, server-sent events, tool-call validation, and private-value export rules.

      The tester provides the origin API, classifier service, and policy data. You won't need to train a model or pay for API calls.
  - question_markdown: Why should I build such a project?
    answer_markdown: |-
      Why can a filter miss an instruction written with look-alike letters? Why can a canary token leak when its characters arrive in separate stream chunks? Why can an allowed browsing tool still export private data? You'll reproduce these failures and build a defense for each one.

      Your finished proxy can sit between an OpenAI SDK client and an OpenAI-compatible chat completions endpoint. You'll also see each defense's limits: the final export rule matches exact private values after normalization and one decoding layer; it does not track every transformation or catch every injection.
  - question_markdown: What are the prerequisites for this challenge?
    answer_markdown: |-
      You should be comfortable programming in Go or Python and using Git. Familiarity with HTTP and JSON will help; prior experience with machine learning is not required.

      What matters most is curiosity and persistence. You'll develop intuition by exploring, debugging, and discovering solutions yourself.

      While we will make it extremely simple to get started, don't expect this to be a follow-along tutorial.
  testimonials: []
stages:
- slug: fi6
  name: Bind to a port
  difficulty: very_easy
  marketing_md: In this stage, you'll implement an HTTP server that responds to health checks on port `8080`.
- slug: tf0
  name: Proxy the API
  difficulty: easy
  marketing_md: In this stage, you'll implement a proxy for the chat completions API.
- slug: kg7
  name: Block and log
  difficulty: easy
  marketing_md: In this stage, you'll implement policy rules that block or flag matching prompts.
- slug: wt4
  name: Defeat evasion
  difficulty: medium
  marketing_md: In this stage, you'll inspect normalized messages to catch look-alike letters, invisible characters,
    and one layer of base64 encoding while forwarding the original text.
- slug: ro3
  name: Score with heuristics
  difficulty: medium
  marketing_md: In this stage, you'll combine weighted signals from the policy into a heuristic score and report
    which signals fired.
- slug: xd5
  name: Call the classifier
  difficulty: medium
  marketing_md: In this stage, you'll score messages through a classifier service in parallel, enforce a timeout,
    and apply the policy when the service fails.
- slug: si3
  name: Decide with thresholds
  difficulty: medium
  marketing_md: In this stage, you'll combine classifier and heuristic scores using policy thresholds, with stricter
    rules for messages returned by tools.
- slug: qe5
  name: Stop data leaks
  difficulty: medium
  marketing_md: In this stage, you'll redact secrets from incoming messages and block outgoing responses that contain
    a canary token from the system prompt.
- slug: ou9
  name: Inspect streams
  difficulty: medium
  marketing_md: In this stage, you'll inspect server-sent events with a hold-back buffer so a canary split across
    chunks never reaches the client.
- slug: as4
  name: Guard tool calls
  difficulty: medium
  marketing_md: In this stage, you'll enforce tool and destination allowlists by parsing complete tool arguments,
    including arguments received across stream chunks.
- slug: mu9
  name: Stop the exfiltration
  difficulty: hard
  marketing_md: In this stage, you'll connect private tool results to their calls and block exports of protected
    values unless trusted policy permits the tool and destination.
